apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-app-deployment
  namespace: demo
  labels:
    app: user-service
spec:
  selector:
    matchLabels:
      app: user-service
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: user-service
    spec:
      # initContainers:
        # Init containers are exactly like regular containers, except:
          # - Init containers always run to completion.
          # - Each init container must complete successfully before the next one starts.
      containers:
      - name: user-service
        image:  docker.io/jpalaparthi/demo-kube-app:v1
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
          limits:
            cpu: 100m
            memory: 100Mi
       
        env:
            # Pull individual keys from multiple secrets (you can rename them here)
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: dbsecret,  key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: dbsecret,  key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: dbsecret,  key: POSTGRES_DB } }

            # ✅ Concatenated env built from the above:
            - name: DSN
              value: "host=db-service.demo.svc.cluster.local user=$(POSTGRES_USER) password=$(POSTGRES_PASSWORD) dbname=$(POSTGRES_DB) port=5432 sslmode=disable"

        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: user-service-service
  namespace: demo
spec:
  selector:
    app: user-service
  type: LoadBalancer
  ports:
  - name: db-service-port
    protocol: TCP
    port: 18080
    targetPort: 8080
    # If you set the `spec.type` field to `NodePort` and you want a specific port number,
    # you can specify a value in the `spec.ports[*].nodePort` field.
  