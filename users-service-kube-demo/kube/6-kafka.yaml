# --- Headless Service (stable DNS for per-broker addressing) ------------------
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: demo
  labels: { app: kafka }
spec:
  clusterIP: None
  selector: { app: kafka }
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093

---
# --- ClusterIP Service (bootstrap for in-cluster clients) ---------------------
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: demo
  labels: { app: kafka }
spec:
  type: ClusterIP
  selector: { app: kafka }
  ports:
    - name: broker
      port: 9092
      targetPort: 9092

---
# --- Kafka StatefulSet (single broker, KRaft mode) ----------------------------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: demo
  labels: { app: kafka }
spec:
  serviceName: kafka-headless
  replicas: 1
  selector:
    matchLabels: { app: kafka }
  template:
    metadata:
      labels: { app: kafka }
    spec:
      securityContext:
        fsGroup: 1001                   # bitnami/kafka runs as user 1001
      containers:
        - name: kafka
          image: bitnami/kafka:3.7
          imagePullPolicy: IfNotPresent
          ports:
            - { name: broker,     containerPort: 9092 }
            - { name: controller, containerPort: 9093 }
          env:
            # --- KRaft (no ZooKeeper) ---
            - { name: KAFKA_ENABLE_KRAFT, value: "yes" }
            - { name: KAFKA_CFG_PROCESS_ROLES, value: "controller,broker" }
            - { name: KAFKA_CFG_NODE_ID, value: "0" }
            - { name: KAFKA_CFG_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_CFG_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_CFG_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka.demo.svc.cluster.local:9092" }
            - { name: KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CFG_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT" }
            - { name: KAFKA_CFG_CONTROLLER_QUORUM_VOTERS, value: "0@kafka-0.kafka-headless.demo.svc.cluster.local:9093" }
            - { name: ALLOW_PLAINTEXT_LISTENER, value: "yes" }

            # --- Single-node friendly defaults ---
            - { name: KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE, value: "true" }
            - { name: KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }

          volumeMounts:
            - { name: data, mountPath: /bitnami/kafka }

          # Start-up can take a while; use a generous startupProbe.
          startupProbe:
            tcpSocket: { port: 9092 }
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30          # ~5 minutes max

          # Reliable readiness: only check the TCP port.
          readinessProbe:
            tcpSocket: { port: 9092 }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12

          # Liveness after it's been up for a bit.
          livenessProbe:
            tcpSocket: { port: 9092 }
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4

  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard        # Minikube default StorageClass
        resources:
          requests:
            storage: 2Gi

---
# --- Kafka UI (Provectus) ----------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: demo
  labels: { app: kafka-ui }
spec:
  replicas: 1
  selector: { matchLabels: { app: kafka-ui } }
  template:
    metadata:
      labels: { app: kafka-ui }
    spec:
      containers:
        - name: ui
          image: provectuslabs/kafka-ui:latest
          env:
            - { name: KAFKA_CLUSTERS_0_NAME,             value: "local" }
            - { name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS, value: "kafka.demo.svc.cluster.local:9092" }
          ports:
            - { containerPort: 8080, name: http }

---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: demo
  labels: { app: kafka-ui }
spec:
  type: NodePort
  selector: { app: kafka-ui }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30093
