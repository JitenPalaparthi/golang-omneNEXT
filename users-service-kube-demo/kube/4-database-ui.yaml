apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-ui
  namespace: demo
  labels:
    app: dbui
spec:
  selector:
    matchLabels:
      app: dbui
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: dbui
    spec:
      # initContainers:
        # Init containers are exactly like regular containers, except:
          # - Init containers always run to completion.
          # - Each init container must complete successfully before the next one starts.
      containers:
      - name: dbui
        image:  docker.io/library/adminer:latest
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
          limits:
            cpu: 100m
            memory: 100Mi
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: dbui-service
  namespace: demo
spec:
  selector:
    app: dbui
  type: LoadBalancer
  ports:
  - name: db-service-port
    protocol: TCP
    port: 28080
    targetPort: 8080
    # If you set the `spec.type` field to `NodePort` and you want a specific port number,
    # you can specify a value in the `spec.ports[*].nodePort` field.
  